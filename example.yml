# =============================================================================
#  Example Lavalink v4 application.yml with LaggKillar
#  LaggKillar by Its2Pawan - https://github.com/ALLAY-XD-20/LaggKillar
#  Copy this file to application.yml next to your Lavalink.jar and edit it.
# =============================================================================

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # --- LaggKillar (required) ---
    - dependency: "com.github.ALLAY-XD-20:LaggKillar:1.4.1"
      repository: "https://jitpack.io"

    # --- Optional source plugins. The more you install, the more fallback sources work. ---
    # Replace VERSION with the latest release of each plugin.
    # - dependency: "dev.lavalink.youtube:youtube-plugin:VERSION"
    #   snapshot: false
    # - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:VERSION"
    #   snapshot: false

  server:
    password: "youshallnotpass"      # CHANGE THIS
    sources:
      youtube: true                  # set to false if you use the YouTube plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000      # LaggKillar overrides this with its adaptive buffer
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000     # LaggKillar overrides this (default 5000)
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.its2pawan.laggkillar: INFO   # set to DEBUG for more detail
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30

# =============================================================================
#  LaggKillar settings (every option is optional - defaults shown)
# =============================================================================
plugins:
  laggkillar:
    enabled: true

    # --- Sound quality and buffering ---
    frameBufferDurationMs: 10000     # base buffer (1000-60000)
    opusEncodingQuality: 10          # 0-10, 10 = best
    resamplingQuality: HIGH          # LOW | MEDIUM | HIGH
    useSeekGhosting: true
    playerCleanupThresholdMs: 120000
    itemLoaderThreads: 500
    trackStuckThresholdMs: 5000      # faster stuck detection

    # --- Adaptive stabilizer (applies to every song automatically) ---
    adaptiveEnabled: true
    adaptiveMaxBufferMs: 30000
    adaptiveStepMs: 3000
    adaptiveDecayMs: 600000

    # --- Auto recovery ---
    recoveryEnabled: true
    maxRecoveryAttempts: 3
    recoveryDelayMs: 400
    attemptResetMs: 60000
    rateLimitDelayMs: 3000

    # --- Fallback sources ---
    fallbackEnabled: true
    fallbackOnUnavailable: true
    fallbackMaxAttempts: 12
    fallbackTimeoutMs: 20000
    fallbackDurationToleranceMs: 10000
    prefixDisableAfter: 6
    prefixDisableMs: 600000
    degradeAfter: 3
    degradeWindowMs: 300000
    # Tried in this order. Remove the ones you do not have, or add your own.
    fallbackSearchPrefixes:
      - "ytmsearch:"     # YouTube Music
      - "scsearch:"      # SoundCloud
      - "dzsearch:"      # Deezer
      - "spsearch:"      # Spotify
      - "amsearch:"      # Apple Music
      - "tdsearch:"      # Tidal
      - "qbsearch:"      # Qobuz
      - "ymsearch:"      # Yandex Music
      - "vksearch:"      # VK Music
      - "jssearch:"      # JioSaavn
      - "ytsearch:"      # YouTube
      - "bcsearch:"      # Bandcamp
      - "pdsearch:"      # Pandora
      - "gnsearch:"      # Gaana
      - "mcsearch:"      # Mixcloud
      - "amksearch:"     # Audiomack
      - "nndsearch:"     # NicoNico
      - "bilisearch:"    # Bilibili
      - "vmsearch:"      # Vimeo
      - "twsearch:"      # Twitch
      - "nssearch:"      # Napster
      - "ttsearch:"      # TikTok
    # Teach LaggKillar your own prefixes (prefix: source name)
    fallbackPrefixSources: {}
    #  "mysearch:": "mysource"

    # --- Health watchdog ---
    healthMonitorEnabled: true
    healthIntervalMs: 5000
    gcPauseWarnMs: 500
    heapWarnPercent: 90
